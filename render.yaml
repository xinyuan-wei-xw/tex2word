# Tex/PDF to Word
Render Blueprint: deploys the Docker web service. After the first deploy,
fill in the two secret env vars in the Render dashboard (they are never
committed to the repo):
- FIREBASE_SERVICE_ACCOUNT_JSON — service-account key JSON of the
  x-planner-99dd3 Firebase project (enables file storage + sign-in
  verification)
- FIREBASE_WEB_API_KEY — the project's Browser API key (enables the
  sign-in box on the page)
services:
  - type: web
    name: tex2word
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OWNER_EMAIL
        # set to the owner's login email in the Render dashboard
        # (kept out of the repo for privacy)
        value: owner@example.com
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
